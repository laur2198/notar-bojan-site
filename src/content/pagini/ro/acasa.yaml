servicii:
  titlu: "Servicii notariale"
  intro: "Pe pagina fiecărui serviciu găsiți actele de pregătit și cum decurge procedura."

pasi:
  titlu: "Cum lucrăm"
  slogan: |-
    Pregătim dosarul înainte de programare, ca vizita la birou să fie cât mai scurtă.

    Verificăm actele, vă spunem din timp ce lipsește și vă comunicăm onorariul înainte de semnare, ca să evitați drumurile inutile.
  lista:
    # Fotografiile pașilor: PROVIZORIE: fotografie de stoc (Unsplash, vezi docs/licente.md), doar pentru preview. Se înlocuiește cu o fotografie reală a biroului; apoi debifați „Fotografie provizorie”.
    - titlu: "Trimiteți actele"
      text: "Pe email, din pagina serviciului de care aveți nevoie. Puteți atașa fotografii clare sau scanări ale documentelor."
      imagine: "../../../assets/fotografii-provizorii/pas-1-trimiteti-actele.jpg"
      imagineAlt: "«DE VALIDAT: Laptop deschis, acte și un pix pe un birou de lemn»"
      fotoProvizorie: true
    - titlu: "Verificăm dosarul"
      text: "Vă spunem ce mai este necesar și vă comunicăm onorariul și taxele estimate."
      imagine: "../../../assets/fotografii-provizorii/pas-2-verificam-dosarul.jpg"
      imagineAlt: "«DE VALIDAT: Două persoane care citesc împreună un document, la o masă»"
      fotoProvizorie: true
    - titlu: "Semnați la birou"
      text: "Stabilim împreună data. La birou veniți cu actele originale, pentru semnare."
      imagine: "../../../assets/fotografii-provizorii/pas-3-semnati-la-birou.jpg"
      imagineAlt: "«DE VALIDAT: Mână care semnează un document pe o masă de lemn»"
      fotoProvizorie: true

