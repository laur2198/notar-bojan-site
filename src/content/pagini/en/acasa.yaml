pasi:
  titlu: "How it works"
  slogan: |-
    We prepare your file before the appointment, to keep your visit to the office short.

    We check your documents, tell you in advance what is missing and give you the fees before signing, so you can avoid unnecessary trips.
  lista:
    # Step photos: PROVISIONAL: stock photo (Unsplash, see docs/licente.md), preview only. The image itself is set on the Romanian page.
    - titlu: "Send your documents"
      text: "By email, as clear photos or scans. Tell us which act you need."
      imagineAlt: "«DE VALIDAT: Open laptop, documents and a pen on a wooden desk»"
    - titlu: "We check your file"
      text: "We let you know what else is needed and give you an estimate of the fees and taxes."
      imagineAlt: "«DE VALIDAT: Two people reviewing a document together at a table»"
    - titlu: "Sign at the office"
      text: "We agree on a date. Bring the original documents and your ID or passport."
      imagineAlt: "«DE VALIDAT: Hand signing a document on a wooden table»"

